name: Supabase Free-Tier Keep-Alive

on:
  schedule:
    # Runs at 08:00 UTC every 3 days to prevent 7-day inactivity pause
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/rest/v1/chats?select=id&limit=1"
