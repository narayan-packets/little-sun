[build]
  command = "npm run build"
  publish = "dist"

# Cache control headers: ensure index.html and SPA routes never get cached by mobile/desktop browsers
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0, s-maxage=0"
    Pragma = "no-cache"
    Expires = "0"
    CDN-Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0, s-maxage=0"
    Pragma = "no-cache"
    Expires = "0"
    CDN-Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

# Vite hashed assets can be cached safely and immutably
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Edge proxy for Little Sun Gateway (Tailscale Funnel)
# Proxies /gateway-proxy/* seamlessly to your live Tailscale Funnel endpoint
# (Replace with your actual Tailscale Funnel domain or rely on direct VITE_GATEWAY_URL)
[[redirects]]
  from = "/gateway-proxy/*"
  to = "https://<your-laptop>.<your-tailnet>.ts.net/:splat"
  status = 200
  force = true

# SPA client-side routing (/newchat, /settings, /account, /voices, /chat-001, /login, etc.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
